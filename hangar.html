<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Hangar - ボブの秘密基地</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/fixedcolumns/4.3.0/css/fixedColumns.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/fixedcolumns/4.3.0/js/dataTables.fixedColumns.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        :root {
            --bg-color: #1a1c1e;
            --accent-color: #00d4ff;
            --text-color: #e0e0e0;
            --card-bg: #25282c;
            --border-color: #444;
            --header-total-height: 165px;
        }

        html, body {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; font-family: sans-serif;
        }

        /* スクロールバーのカスタマイズ（太く・青く） */
        .dataTables_scrollBody::-webkit-scrollbar {
            width: 12px; height: 12px;
        }
        .dataTables_scrollBody::-webkit-scrollbar-track {
            background: #111;
        }
        .dataTables_scrollBody::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 6px;
            border: 2px solid #111; /* 隙間を作って立体感を出す */
        }
        .dataTables_scrollBody::-webkit-scrollbar-thumb:hover {
            background: #00b8e6;
        }

        /* 共通ヘッダー構造 */
        .top-section {
            height: var(--header-total-height);
            background: var(--bg-color);
            border-bottom: 2px solid var(--accent-color);
            padding: 10px 20px; box-sizing: border-box;
            position: relative; z-index: 100;
        }
        .header-flex { display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 5px 0; font-size: 1.5em; }
        header h1 a { color: var(--accent-color); text-decoration: none; }

        .nav-right { display: flex; align-items: center; gap: 10px; }
        nav a {
            color: var(--text-color); text-decoration: none; margin-left: 10px;
            font-size: 0.9em; padding: 5px 8px; border: 1px solid transparent; transition: 0.2s;
        }
        nav a:hover { border: 1px solid var(--accent-color); color: var(--accent-color); }
        nav a.active { color: var(--accent-color); font-weight: bold; }
        
        .form-link {
            color: #fff !important; background: #d93025; border-radius: 4px;
            padding: 5px 12px !important; font-weight: bold; border: none !important;
        }

        .search-container { margin: 10px 0; display: flex; align-items: center; gap: 10px; }
        #search-box {
            background: #333; border: 1px solid var(--border-color);
            color: white; padding: 8px; border-radius: 4px; flex-grow: 1; outline: none;
        }

        .tab-wrapper { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn {
            background: #333; color: #aaa; border: none; padding: 8px 16px;
            cursor: pointer; border-radius: 4px 4px 0 0; white-space: nowrap; font-weight: bold;
        }
        .tab-btn.active { background: var(--accent-color); color: #000; }

        .main-content { height: calc(100vh - var(--header-total-height)); background: #111; }
        table.dataTable { background: #000; margin: 0 !important; font-size: 0.85em; }
        table.dataTable thead th { background: #222; color: var(--accent-color); border-bottom: 1px solid var(--accent-color); }
        table.dataTable tbody td { background: #111; color: #ccc; border-bottom: 1px solid #222; }
        .DTFC_LeftBodyLiner, .DTFC_LeftHeadWrapper { background-color: #111 !important; }

        .bay-cell { font-family: monospace; color: var(--accent-color); font-weight: bold; text-align: center; }
        .deploy-input { background: #000; border: 1px solid #555; color: var(--accent-color); width: 60px; text-align: center; border-radius: 3px; }
        .memo-input { background: #222; border: 1px solid #444; color: #fff; width: 150px; padding: 2px 5px; font-size: 0.9em; border-radius: 3px; }
        .action-btn { cursor: pointer; padding: 4px 8px; border-radius: 3px; font-size: 0.8em; border: none; font-weight: bold; }
        .reg-btn { background: var(--accent-color); color: #000; }
        .del-btn { background: #442222; color: #ff6666; }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center;
            align-items: center; z-index: 2000; flex-direction: column;
        }
    </style>
</head>
<body>

<div id="overlay">
    <p style="color:var(--accent-color); font-size:0.8em; letter-spacing:3px;">SYNCING HANGAR DATA...</p>
</div>

<div class="top-section">
    <div class="header-flex">
        <header><h1><a href="index.html">ボブの秘密基地</a></h1></header>
        <div class="nav-right">
            <nav>
                <a href="unit.html">Unit</a>
                <a href="derivatives.html">Derivatives</a>
                <a href="tactics.html">Tactics</a>
                <a href="trivia.html">Trivia</a>
                <a href="hangar.html" class="active">Hangar</a>
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSdpAAnW7SndN-zX02Y4y708V3f2Yf085lEIdC9qXyEms-B3mw/viewform" target="_blank" class="form-link">情報提供(Google Form)</a>
            </nav>
        </div>
    </div>
    <div class="search-container">
        <input type="text" id="search-box" placeholder="配備済み機体を絞り込み...">
    </div>
    <div class="tab-wrapper" id="memberTabs"></div>
</div>

<div class="main-content">
    <table id="hangarTable" class="display nowrap" style="width:100%">
        <thead><tr id="tableHeader"></tr></thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxbNqD5XbkQFOEcRXvL5XQY5J4B1Woq2T1v033J-3qm-OaX9cpFG4Pol1RyRd_tkQG-_g/exec";
    const CSV_URL = "unit_26.3.24.csv";
    const PILOTS = ["オロ〇ミン", "ライナセロス", "カイジン", "炎のナイト", "Net", "なぎさ", "オズナ", "アルトリア", "ボブ", "ナメレス", "Yggdrasill"];
    
    let masterData = [];
    let cloudData = [];
    let activePilot = PILOTS[0];
    let table = null;

    $(document).ready(async function() {
        initTabs();
        await loadCSV();
        await fetchCloudData();
        $("#overlay").fadeOut();
    });

    function initTabs() {
        const $tw = $('#memberTabs');
        PILOTS.forEach(p => {
            $('<button class="tab-btn"></button>').text(p).toggleClass('active', p === activePilot)
                .on('click', function() {
                    activePilot = p;
                    $('.tab-btn').removeClass('active'); $(this).addClass('active');
                    renderTable();
                }).appendTo($tw);
        });
    }

    function loadCSV() {
        return new Promise(res => {
            Papa.parse(CSV_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: (results) => { masterData = results.data; res(); }
            });
        });
    }

    async function fetchCloudData() {
        try {
            cloudData = await $.getJSON(GAS_URL);
            renderTable();
        } catch (e) { console.error("GAS通信エラー"); }
    }

    function renderTable() {
        if (table) { table.destroy(); $('#tableHeader, #tableBody').empty(); }

        // ヘッダー（BAY, 操作, MEMO, CSV項目）
        const headers = ["BAY", "ACTION", "PILOT'S MEMO", ...Object.keys(masterData[0])];
        headers.forEach(h => $('#tableHeader').append(`<th>${h}</th>`));

        const pilotUnits = cloudData.filter(d => d.memberName === activePilot);

        for (let i = 1; i <= 10; i++) {
            const reg = pilotUnits.find(u => Number(u.slotIndex) === i);
            const unit = reg ? masterData.find(m => String(m.No) === String(reg.unitNo)) : null;
            const currentNote = reg ? (reg.note || "") : "";
            
            const $tr = $('<tr></tr>');
            $tr.append(`<td class="bay-cell">BAY-${String(i).padStart(2,'0')}</td>`);

            if (unit) {
                $tr.append(`<td><button class="action-btn del-btn" onclick="updateSlot(${i}, '', '')">RESERVE</button></td>`);
                $tr.append(`<td><input type="text" class="memo-input" id="memo-${i}" value="${currentNote}" placeholder="メモを入力..." onchange="handleDeploy(${i})"></td>`);
                Object.values(unit).forEach(val => $tr.append(`<td>${val || ''}</td>`));
            } else {
                $tr.append(`<td><button class="action-btn reg-btn" onclick="handleDeploy(${i})">DEPLOY</button></td>`);
                $tr.append(`<td><input type="text" class="memo-input" id="memo-${i}" placeholder="先にNoを入力"></td>`);
                $tr.append(`<td><input type="number" class="deploy-input" id="in-${i}" placeholder="No."></td>`);
                for(let j=1; j < Object.keys(masterData[0]).length; j++) $tr.append('<td></td>');
            }
            $('#tableBody').append($tr);
        }

        table = $('#hangarTable').DataTable({
            scrollY: "calc(100vh - 200px)", scrollX: true, paging: false, info: false,
            fixedColumns: { left: 4 }, // BAY, ACTION, MEMO, No 
            dom: 'rti', ordering: false
        });
        $('#search-box').on('input', function() { table.search(this.value).draw(); });
    }

    async function handleDeploy(slot) {
        const no = $(`#in-${slot}`).val() || cloudData.find(d => d.memberName === activePilot && Number(d.slotIndex) === slot)?.unitNo;
        const note = $(`#memo-${slot}`).val();

        if (!no) {
            alert("機体Noを入力してください。");
            return;
        }
        if (!masterData.some(m => String(m.No) === String(no))) {
            alert("無効な機体Noです。");
            return;
        }
        await updateSlot(slot, no, note);
    }

    async function updateSlot(slot, no, note) {
        $("#overlay").fadeIn();
        const payload = { memberName: activePilot, slotIndex: slot, unitNo: no, note: note };
        await $.post(GAS_URL, JSON.stringify(payload));
        await fetchCloudData();
        $("#overlay").fadeOut();
    }
</script>
</body>
</html>
